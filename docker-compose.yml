# ECO CLUB — containerised stack (optional)
#   docker compose up --build
#   Frontend: http://localhost:5173  |  Backend API: http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecoclub
      POSTGRES_USER: ecoclub
      POSTGRES_PASSWORD: ecoclub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DB_ENGINE: postgres
      POSTGRES_DB: ecoclub
      POSTGRES_USER: ecoclub
      POSTGRES_PASSWORD: ecoclub
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: change-me
    depends_on: [db]
    ports: ["8000:8000"]
    command: sh -c "python manage.py migrate && python manage.py seed && python manage.py runserver 0.0.0.0:8000"
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes:
  pgdata: